name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout the repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (Temurin / Eclipse Adoptium) ──────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Set up Gradle (validates wrapper, enables caching) ────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Accept Android SDK licenses (non-interactive) ────────────────────
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── 5. Install required SDK platform and build tools ────────────────────
      - name: Install SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35"   \
            "build-tools;35.0.0"     \
            "platform-tools"

      # ── 6. Grant execute permission to gradlew ──────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 7. Build the Debug APK ───────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 8. Upload APK as a downloadable GitHub Actions Artifact ─────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OnlineRPTrans-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 9. Print a summary in the Actions run page ──────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section at the top of this Actions run." >> $GITHUB_STEP_SUMMARY
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -sh $APK | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
